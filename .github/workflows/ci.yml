name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix precommit (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    strategy:
      # Elixir stays at 1.20.1 (the project requires ~> 1.20); we vary OTP to catch VM-version
      # issues. fail-fast off so one OTP's result doesn't cancel the others.
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]

    steps:
      - uses: actions/checkout@v4

      # setup-beam pulls precompiled builds, so no BEAM install cost. exqlite (test-only) compiles
      # its bundled SQLite from source with the runner's default C toolchain — no system packages.
      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          # _build artifacts are OTP-specific, so key the cache on the OTP version too.
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # The project's own gate: compile --warnings-as-errors, deps.unlock --unused,
      # format --check-formatted, and the test suite (integration tests, which need a real
      # libsql client, are excluded by test_helper.exs — run with --include integration).
      - name: Run checks
        run: mix precommit
